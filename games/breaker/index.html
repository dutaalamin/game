<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Neon Breaker — Brick Breaker</title>
    <meta name="description" content="A modern neon brick breaker. Break every brick, chain combos, chase the high score." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg-0: #05060e;
        --bg-1: #0b0f22;
        --ink: #eaf0ff;
        --dim: #7c88a8;
        --cyan: #22d3ee;
        --violet: #a855f7;
        --pink: #f472b6;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        background: var(--bg-0);
        color: var(--ink);
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
      }
      #app {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(1200px 700px at 50% -10%, rgba(34, 211, 238, 0.10), transparent 60%),
          radial-gradient(900px 600px at 90% 110%, rgba(168, 85, 247, 0.10), transparent 60%),
          linear-gradient(180deg, var(--bg-1), var(--bg-0));
      }
      #stage {
        position: relative;
        line-height: 0;
        border-radius: 18px;
        overflow: hidden;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.06),
          0 40px 120px -40px rgba(34, 211, 238, 0.35),
          0 0 90px -30px rgba(168, 85, 247, 0.35);
      }
      #game {
        display: block;
        touch-action: none;
        cursor: none;
        max-width: 100vw;
        max-height: 100vh;
      }
      #hint {
        position: fixed;
        bottom: 10px;
        left: 0;
        right: 0;
        text-align: center;
        color: #46506b;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        pointer-events: none;
        user-select: none;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-DhsdeVqu.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="stage"><canvas id="game"></canvas></div>
    </div>
    <div id="hint">Move: mouse / ← → &nbsp;·&nbsp; Launch: click or space &nbsp;·&nbsp; Pause: P or Esc</div>
  </body>
</html>
